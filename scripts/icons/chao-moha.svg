<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="640" height="640">
  <!-- A footed offering tray (ថាស) heaped with fruit to be counted: a pyramid of
       round fruit (3 · 2 · 1) with a leaf on the crown, .
       Original drawing; fruit and leaves only, no flowers. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160">
      <rect width="160" height="160" fill="#fff"/>
      <!-- the gaps that separate the shapes -->
      <g fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round">
        <circle cx="52" cy="103" r="15.5"/><circle cx="80" cy="103" r="15.5"/><circle cx="108" cy="103" r="15.5"/>
        <circle cx="66" cy="77" r="15.5"/><circle cx="94" cy="77" r="15.5"/>
        <circle cx="80" cy="51" r="15.5"/>
        <path d="M30 121 H130"/>
        <path d="M56 136 H104"/>
      </g>
      <!-- a highlight on each fruit -->
      <g fill="#000">
        <path d="M44 97 a9 9 0 0 1 6-6 a1.6 1.6 0 0 1 1 3 a6 6 0 0 0-4 4 a1.6 1.6 0 0 1-3-1z"/>
        <path d="M72 97 a9 9 0 0 1 6-6 a1.6 1.6 0 0 1 1 3 a6 6 0 0 0-4 4 a1.6 1.6 0 0 1-3-1z"/>
        <path d="M100 97 a9 9 0 0 1 6-6 a1.6 1.6 0 0 1 1 3 a6 6 0 0 0-4 4 a1.6 1.6 0 0 1-3-1z"/>
        <path d="M58 71 a9 9 0 0 1 6-6 a1.6 1.6 0 0 1 1 3 a6 6 0 0 0-4 4 a1.6 1.6 0 0 1-3-1z"/>
        <path d="M86 71 a9 9 0 0 1 6-6 a1.6 1.6 0 0 1 1 3 a6 6 0 0 0-4 4 a1.6 1.6 0 0 1-3-1z"/>
        <path d="M72 45 a9 9 0 0 1 6-6 a1.6 1.6 0 0 1 1 3 a6 6 0 0 0-4 4 a1.6 1.6 0 0 1-3-1z"/>
        <!-- the tray's engraved band -->
        <rect x="40" y="125" width="80" height="2.4" rx="1.2"/>
        <!-- the leaf's midrib -->
        <path d="M82 36 Q92 27 102 25" stroke="#000" stroke-width="1.8" fill="none"/>
      </g>
    </mask>
  </defs>
  <g transform="translate(80 82) scale(1.16) translate(-80 -84)"><g mask="url(#cut)" fill="#000">
    <!-- the fruit -->
    <circle cx="52" cy="103" r="15.5"/><circle cx="80" cy="103" r="15.5"/><circle cx="108" cy="103" r="15.5"/>
    <circle cx="66" cy="77" r="15.5"/><circle cx="94" cy="77" r="15.5"/>
    <circle cx="80" cy="51" r="15.5"/>
    <!-- stem and leaf on the crown -->
    <path d="M79 37 q-1-6 2-10 l3 1 q-3 4-2 9z"/>
    <path d="M82 36 Q86 22 104 22 Q100 36 82 36z"/>
    <!-- the tray: a wide dish, a waisted stem and a round foot -->
    <path d="M26 117 H134 Q132 128 118 130 H42 Q28 128 26 117z"/>
    <path d="M66 130 H94 Q88 134 88 138 H72 Q72 134 66 130z"/>
    <path d="M54 138 H106 Q108 145 100 146 H60 Q52 145 54 138z"/>
  </g></g>
</svg>
